<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donanım mı, Yazılım mı? — Bilfen DigiQuest</title>
<!--
  TEKNOLOJİ YOLCULUĞUM BAŞLIYOR - 1. SINIF - DONANIM-YAZILIM (EŞLEŞTİRME)
  Bilfen Bilişim Zümresi tarafından Wordwall karşıtı olarak sıfırdan yazıldı.
  Öğrenci kartı "Donanım" veya "Yazılım" kutusuna sınıflandırır.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg,#f97316 0%,#ef4444 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .kart { background: #fff; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.3); max-width: 620px; width: 100%; padding: 28px; text-align: center; }
  .rozet { display: inline-block; background: #fff7ed; color: #ea580c; padding: 6px 16px; border-radius: 999px; font-weight: 800; font-size: 13px; margin-bottom: 12px; }
  h1 { color: #1e293b; font-size: 24px; margin-bottom: 4px; }
  .alt { color: #64748b; font-size: 14px; margin-bottom: 18px; line-height: 1.5; }
  .kutu-satir { display: flex; gap: 12px; margin-bottom: 16px; }
  .hedef { flex: 1; padding: 16px 8px; border-radius: 14px; border: 3px dashed #cbd5e1; font-weight: 800; font-size: 16px; color: #475569; transition: all .2s; }
  .hedef.donanim { background: #eff6ff; }
  .hedef.yazilim { background: #fdf4ff; }
  .hedef.uzerinde { border-color: #f59e0b; background: #fef3c7; }
  .hedef.dogru-gitti { border-color: #16a34a; background: #dcfce7; }
  .hedef.yanlis-gitti { border-color: #dc2626; background: #fee2e2; }
  .kart-el { background: linear-gradient(135deg,#6366f1,#8b5cf6); color: #fff; border-radius: 16px; padding: 20px 16px; font-size: 20px; font-weight: 800; box-shadow: 0 8px 24px rgba(99,102,241,.4); margin-bottom: 14px; cursor: grab; user-select: none; }
  .kart-el .emoji { font-size: 40px; display: block; margin-bottom: 6px; }
  .kart-el.sonraki-anim { animation: giris .3s ease; }
  @keyframes giris { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .buton-satir { display: flex; gap: 10px; }
  .btn { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; transition: transform .1s; }
  .btn:active { transform: scale(.97); }
  .btn-donanim { background: #3b82f6; color: #fff; }
  .btn-yazilim { background: #a855f7; color: #fff; }
  .skor-kutusu { display: flex; justify-content: space-between; color: #64748b; font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .geri-bildirim { min-height: 24px; font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .ok { color: #16a34a; } .hata { color: #dc2626; }
  .ilerleme { height: 10px; background: #e2e8f0; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
  .ilerleme > div { height: 100%; background: linear-gradient(90deg,#f97316,#ef4444); transition: width .3s; }
  .sonuc { display: none; }
  .sonuc .puan { font-size: 44px; font-weight: 900; color: #f97316; margin-bottom: 12px; }
  .btn-tek { display: inline-block; padding: 14px 40px; border: none; border-radius: 14px; background: #f97316; color: #fff; font-size: 17px; font-weight: 800; cursor: pointer; margin-top: 12px; }
</style>
</head>
<body>
<div class="kart">
  <div id="oynaNokta">
    <span class="rozet">1. SINIF · TEKNOLOJİ YOLCULUĞUM</span>
    <h1>🔌 Donanım mı, Yazılım mı?</h1>
    <p class="alt">Gelen kartı doğru kutuya ayır: <b>Donanım</b> = elle tutulan parçalar, <b>Yazılım</b> = bilgisayardaki programlar.</p>
    <div class="skor-kutusu"><span id="kartSayi">Kart 1</span><span id="skorMetin">Puan: 0</span></div>
    <div class="ilerleme"><div id="ilerlemeCubuk" style="width:0%"></div></div>
    <div class="kart-el" id="kartEl"></div>
    <div class="geri-bildirim" id="geriBildirim"></div>
    <div class="buton-satir">
      <button class="btn btn-donanim" id="btnDonanim">🖥️ DONANIM</button>
      <button class="btn btn-yazilim" id="btnYazilim">💾 YAZILIM</button>
    </div>
    <p style="margin-top:10px;font-size:12px;color:#94a3b8">İpucu: kart veya butonları kullanabilirsin.</p>
  </div>
  <div id="sonucKart" class="sonuc">
    <div style="font-size:52px" id="sonucEmoji">🏆</div>
    <div style="font-size:28px;margin-bottom:10px;font-weight:800;color:#1e293b">Bitti!</div>
    <div class="puan" id="sonucPuan"></div>
    <p id="sonucMesaj" style="color:#64748b"></p>
    <button class="btn-tek" onclick="location.reload()">🔄 Tekrar Oyna</button>
  </div>
</div>
<script>
(function () {
  'use strict';
  var KARTLAR = [
    { ad: 'Klavye', emoji: '⌨️', tip: 'donanim' },
    { ad: 'Boyama Programı', emoji: '🎨', tip: 'yazilim' },
    { ad: 'Fare', emoji: '🖱️', tip: 'donanim' },
    { ad: 'Müzik Uygulaması', emoji: '🎵', tip: 'yazilim' },
    { ad: 'Ekran (Monitör)', emoji: '🖥️', tip: 'donanim' },
    { ad: 'Oyun Yazılımı', emoji: '🎮', tip: 'yazilim' },
    { ad: 'Kasa (Bilgisayarda ana kutu)', emoji: '🗄️', tip: 'donanim' },
    { ad: 'Hesap Makinesi Programı', emoji: '🔢', tip: 'yazilim' },
    { ad: 'Kulaklık', emoji: '🎧', tip: 'donanim' },
    { ad: 'Yazı Yazma Programı', emoji: '📝', tip: 'yazilim' }
  ];
  var i = 0, puan = 0, kilitli = false;
  var kartEl = document.getElementById('kartEl');
  var kartSayiEl = document.getElementById('kartSayi');
  var skorEl = document.getElementById('skorMetin');
  var geriEl = document.getElementById('geriBildirim');
  var cubukEl = document.getElementById('ilerlemeCubuk');

  function karistir(liste) {
    for (var j = liste.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var g = liste[j]; liste[j] = liste[k]; liste[k] = g;
    }
    return liste;
  }
  karistir(KARTLAR);

  function kartGoster() {
    kilitli = false;
    geriEl.textContent = ''; geriEl.className = 'geri-bildirim';
    kartSayiEl.textContent = 'Kart ' + (i + 1) + ' / ' + KARTLAR.length;
    cubukEl.style.width = (i / KARTLAR.length * 100) + '%';
    var k = KARTLAR[i];
    kartEl.innerHTML = '<span class="emoji">' + k.emoji + '</span>' + k.ad;
    kartEl.style.cursor = 'grab';
  }

  function sec(tip) {
    if (kilitli) return;
    kilitli = true;
    var k = KARTLAR[i];
    if (tip === k.tip) {
      puan += 10;
      geriEl.textContent = '✅ Doğru! +10 puan';
      geriEl.className = 'geri-bildirim ok';
    } else {
      geriEl.textContent = k.tip === 'donanim' ? '❌ Bu bir DONANIM: elle tutulan bir parça.' : '❌ Bu bir YAZILIM: bilgisayardaki bir program.';
      geriEl.className = 'geri-bildirim hata';
    }
    skorEl.textContent = 'Puan: ' + puan;
    setTimeout(function () {
      i++;
      if (i < KARTLAR.length) { kartGoster(); }
      else bitir();
    }, 1400);
  }

  function bitir() {
    cubukEl.style.width = '100%';
    document.getElementById('oynaNokta').style.display = 'none';
    document.getElementById('sonucKart').style.display = 'block';
    document.getElementById('sonucPuan').textContent = puan + ' puan';
    var toplam = KARTLAR.length * 10;
    var yuzde = Math.round(puan / toplam * 100);
    document.getElementById('sonucEmoji').textContent = yuzde >= 80 ? '🏆' : yuzde >= 50 ? '💪' : '📚';
    document.getElementById('sonucMesaj').textContent = yuzde >= 80 ? 'Harika! Donanım ve yazılımı çok iyi ayırıyorsun.' : yuzde >= 50 ? 'İyi iş! Birkaç kartı tekrar düşünelim.' : 'Tekrar deneyelim!';
  }

  document.getElementById('btnDonanim').addEventListener('click', function () { sec('donanim'); });
  document.getElementById('btnYazilim').addEventListener('click', function () { sec('yazilim'); });
  kartEl.addEventListener('click', function () {
    /* Kartın kendisine tıklamak seçim yapmaz; butonlar veya D/Y tuşları kullanılır */
  });
  /* Klavye kısayolu: D = donanım, Y = yazılım */
  document.addEventListener('keydown', function (e) {
    var harf = (e.key || '').toLowerCase();
    if (harf === 'd') sec('donanim');
    else if (harf === 'y') sec('yazilim');
  });

  kartGoster();
})();
</script>
</body>
</html>
